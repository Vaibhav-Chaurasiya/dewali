<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Dhanteras & Shubh Deepawali | Wishes from Tejasvi Gahlot</title>
<meta name="description" content="Warm Dhanteras and Diwali wishes for friends and family. Spread Light. Share Happiness. Celebrate Together.">
<meta name="theme-color" content="#090D1F">
<meta property="og:title" content="Happy Dhanteras & Shubh Deepawali">
<meta property="og:description" content="Wishes for friends and family from Tejasvi Gahlot">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#090D1F;--royal:#261044;--gold:#FFD700;--orange:#FF8C00;--maroon:#650D18;--cream:#FFF4DC;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--navy);color:var(--cream);font-family:'Poppins',sans-serif;overflow-x:hidden;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
h1,h2,.d{font-family:'Cinzel',serif}
canvas{position:fixed;inset:0;pointer-events:none}
#pc{z-index:0}#fc{z-index:30}
.gt{background:linear-gradient(#FFF4DC,#FFD700 50%,#FF8C00);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(9,13,31,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,215,0,.3);box-shadow:0 0 25px rgba(255,215,0,.25)}
nav b{color:var(--gold)}nav div{display:flex;gap:18px;align-items:center;font-size:14px}
nav a{color:var(--cream);text-decoration:none;opacity:.85}nav a:hover{color:var(--gold)}
@media(max-width:620px){nav .lk{display:none}}
button,.btn{font:500 15px 'Poppins',sans-serif;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;color:var(--navy);background:linear-gradient(90deg,var(--gold),var(--orange));box-shadow:0 0 24px rgba(255,140,0,.5);transition:transform .2s;text-decoration:none;display:inline-block}
button:hover,.btn:hover{transform:scale(1.06)}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.alt{background:rgba(255,255,255,.06);color:var(--gold);border:1px solid rgba(255,215,0,.7);box-shadow:none;backdrop-filter:blur(8px)}
#mu{width:38px;height:38px;padding:0;font-size:16px;background:none;color:var(--gold);border:1px solid rgba(255,215,0,.6);box-shadow:none}
main{position:relative;z-index:10}
section{position:relative;overflow:hidden;padding:90px 16px;text-align:center}
#home{min-height:100vh;display:grid;place-items:center;background:linear-gradient(rgba(9,13,31,.7),rgba(38,16,68,.6),transparent)}
#dh{background:linear-gradient(transparent,rgba(101,13,24,.45),transparent)}
#di{background:linear-gradient(transparent,rgba(38,16,68,.75),rgba(9,13,31,.6))}
.pat{background-image:radial-gradient(circle,rgba(255,215,0,.14) 2px,transparent 3px);background-size:34px 34px}
.in{position:relative;z-index:2;max-width:760px;margin:auto}
h1{font-size:clamp(32px,8vw,64px);line-height:1.15;margin:0;filter:drop-shadow(0 0 22px rgba(255,215,0,.4))}
h2{font-size:clamp(28px,6vw,50px);margin:0 0 20px}
.sub{font-weight:300;font-size:clamp(16px,3vw,22px);opacity:.9}
